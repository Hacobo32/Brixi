# This workflow builds the Brixi iOS app (Xcode project + Swift Package
# Manager dependency on the Meta Wearables DAT SDK). There is no root
# Package.swift, so plain `swift build`/`swift test` don't apply here —
# the app must be built with xcodebuild against an iOS Simulator destination.

name: iOS

on:
  push:
    branches: [ "claude/marketplace-plugin-setup-58yrds" ]
  pull_request:
    branches: [ "claude/marketplace-plugin-setup-58yrds" ]

jobs:
  build:

    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4
    - name: Resolve Swift Package dependencies
      run: xcodebuild -resolvePackageDependencies -project Brixi.xcodeproj -scheme Brixi
    - name: Build
      run: |
        xcodebuild build \
          -project Brixi.xcodeproj \
          -scheme Brixi \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          CODE_SIGNING_ALLOWED=NO
